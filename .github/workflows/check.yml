name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Check out the tested new-api runtime
        uses: actions/checkout@v4
        with:
          repository: QuantumNous/new-api
          ref: 206e0fa5c600127a314a97f88592c067f784f4a6
          path: host
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: Verify with the new-api JavaScript engine and built-in plugins
        run: |
          cd host
          go run "$GITHUB_WORKSPACE/tools/contract/main.go" \
            -plugin "$GITHUB_WORKSPACE/plugin.js" \
            -fixture "$GITHUB_WORKSPACE/test/contract-fixture.json"
